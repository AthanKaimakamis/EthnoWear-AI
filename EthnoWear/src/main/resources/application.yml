spring:
  application:
    name: ethnowear

  cache:
    type: caffeine
    cache-names:
      - ontology-reference-full
    caffeine:
      spec: maximumSize=4,expireAfterWrite=30m

  docker:
    compose:
      enabled: false

  datasource:
    url: ${ETHNOWEAR_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=EthnoWear;encrypt=true;trustServerCertificate=true}
    username: ${ETHNOWEAR_DB_USERNAME:sa}
    password: ${ETHNOWEAR_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ethnowear
        use_nationalized_character_data: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: ${ETHNOWEAR_MEDIA_MAX_FILE_SIZE:25MB}
      max-request-size: ${ETHNOWEAR_MEDIA_MAX_REQUEST_SIZE:26MB}

ethnowear:
  ontology:
    path: ${ETHNOWEAR_ONTOLOGY_PATH:Ontology/EthnoWear.owx}
    namespace: ${ETHNOWEAR_ONTOLOGY_NAMESPACE:http://www.semanticweb.org/athan/ontologies/2026/4/ethno-wear#}

  media:
    storage-root: ${ETHNOWEAR_MEDIA_STORAGE_ROOT:media}
    max-file-size: ${ETHNOWEAR_MEDIA_MAX_FILE_SIZE:25MB}
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - application/pdf

  security:
    jwt:
      secret: ${ETHNOWEAR_JWT_SECRET}
      issuer: ${ETHNOWEAR_JWT_ISSUER:ethnowear-api}
      ttl: ${ETHNOWEAR_JWT_TTL:15m}

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
