[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnowear-figure-worker"
version = "0.1.0"
description = "EthnoWear deterministic page-figure extraction worker"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ethnowear-worker-common==0.1.0",
    "httpx>=0.28,<1",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
ethnowear-figure-worker = "ethnowear_figure_worker.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]