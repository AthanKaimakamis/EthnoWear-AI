[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnowear-worker-common"
version = "0.1.0"
description = "Shared runtime and Spring worker API contract for EthnoWear workers"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
