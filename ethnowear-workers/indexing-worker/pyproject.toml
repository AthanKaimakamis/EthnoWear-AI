[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnowear-indexing-worker"
version = "0.1.0"
description = "EthnoWear Spring-embedding and Qdrant indexing worker"
requires-python = ">=3.13,<3.15"

dependencies = [
    "ethnowear-worker-common==0.1.0",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "qdrant-client>=1.15,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2"
]

[project.scripts]
ethnowear-indexer = "ethnowear_indexer.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
