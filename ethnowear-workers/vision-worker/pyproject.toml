[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnowear-vision-worker"
version = "0.1.0"
description = "EthnoWear advisory vision OCR assessment worker"
requires-python = ">=3.13,<3.15"

dependencies = [
    "ethnowear-worker-common==0.1.0",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ethnowear_vision_worker = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
