[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnowear-document-worker"
version = "0.1.0"
description = "Containerized document-processing worker for EthnoWear"
requires-python = ">=3.13,<3.15"

dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pymupdf>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
ethnowear-worker = "ethnowear_worker.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
